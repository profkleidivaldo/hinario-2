<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hinário">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Hinário Adventista do 7º Dia</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1c2430;--mu:#6b7684;--ac:#1e3a5f;--ac2:#f2c14e;--bd:#e3dfd2;--hd:#1e3a5f;--hdtx:#fff}
:root[data-theme=dark]{--bg:#14181c;--card:#1e2327;--tx:#ecebe6;--mu:#97a1ad;--ac:#8fb4e8;--ac2:#f2c14e;--bd:#2c333a;--hd:#1e2327;--hdtx:#ecebe6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--hd);color:var(--hdtx);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:inherit}
.ib:active{background:rgba(127,127,127,.25)}
main{flex:1;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.search{position:sticky;top:0;background:var(--bg);padding:12px 0 6px;z-index:3}
.search input{width:100%;padding:12px 16px;border-radius:24px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;outline:none}
.search input:focus{border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:18px;border:1px solid var(--bd);background:var(--card);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.item:active{transform:scale(.99)}
.num{flex:none;min-width:48px;height:40px;border-radius:10px;background:var(--ac);color:var(--bg);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mu);font-size:13px}
.item .st{color:var(--ac2);font-size:18px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.count{color:var(--mu);font-size:13px;padding:0 2px 8px}
/* hino */
.meta{padding:16px 0 6px}
.meta .big{font-size:13px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.meta h2{margin:2px 0 4px;font-size:1.5em;line-height:1.2}
.meta p{margin:2px 0;color:var(--mu);font-size:14px}
.verse{margin:20px 0;display:flex;gap:12px}
.verse .vn{flex:none;width:26px;color:var(--ac);font-weight:700;font-size:.8em;padding-top:.25em}
.verse .vt{white-space:pre-line;font-size:var(--fs,20px);line-height:1.55}
.verse.coro{background:var(--card);border-left:4px solid var(--ac2);border-radius:0 10px 10px 0;padding:10px 14px;margin-left:0}
.verse.coro .vt{font-style:italic}
.verse.coro .vn{width:auto;color:var(--ac2)}
.bar{position:sticky;bottom:0;background:var(--hd);color:var(--hdtx);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:5}
.bar button{padding:6px 10px;border-radius:10px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:56px}
.bar button span{font-size:20px;line-height:1.2}
.bar button.on{color:var(--ac2)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:24px 0}
.nav button{flex:1;padding:12px;border:1px solid var(--bd);background:var(--card);border-radius:12px}
.nav button:disabled{opacity:.35}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.show{opacity:1}
.hide{display:none!important}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(127,127,127,.25)}
</style>
</head>
<body>
<header>
  <button class="ib hide" id="back" aria-label="Voltar">←</button>
  <h1 id="title">Hinário Adventista</h1>
  <span class="pill hide" id="net">offline</span>
  <button class="ib hide" id="install" aria-label="Instalar app" title="Instalar app">⬇</button>
  <button class="ib" id="theme" aria-label="Alternar tema">◐</button>
</header>

<main id="main"></main>

<div class="bar hide" id="bar">
  <button id="fsm"><span>A−</span>menor</button>
  <button id="fsp"><span>A+</span>maior</button>
  <button id="rep"><span>↻</span>repetir coro</button>
  <button id="wake"><span>☀</span>tela ligada</button>
  <button id="fav"><span>☆</span>favorito</button>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
let H = [], idx = [], cats = [];
let favs = new Set(LS.get('favs',[]));
let S = Object.assign({fs:20,rep:true,theme:null}, LS.get('settings',{}));
let q = '', cat = 'Todos', wakeLock = null;

const saveS = () => LS.set('settings', S);
const saveF = () => LS.set('favs', [...favs]);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function applyTheme(){
  const t = S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t==='dark' ? '#1e2327' : '#1e3a5f';
}
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- LISTA ---------- */
function renderList(keepScroll){
  $('#back').classList.add('hide'); $('#bar').classList.add('hide');
  $('#title').textContent = 'Hinário Adventista';
  releaseWake();
  const main = $('#main');
  if(!main.querySelector('#q')){
    main.innerHTML = `<div class="wrap">
      <div class="search"><input id="q" type="search" placeholder="Buscar por número, título ou trecho da letra…" autocomplete="off" value="${esc(q)}"></div>
      <div class="chips" id="chips"></div><div class="count" id="count"></div><div id="list"></div></div>`;
    $('#q').addEventListener('input', e=>{q=e.target.value;fillList()});
    $('#chips').innerHTML = ['Todos','★ Favoritos',...cats].map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('');
    $('#chips').addEventListener('click', e=>{
      const b=e.target.closest('.chip'); if(!b) return; cat=b.dataset.c; fillList();
    });
  }
  fillList();
  if(keepScroll!==undefined) main.scrollTop = keepScroll;
}
function fillList(){
  document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on', b.dataset.c===cat));
  const nq = norm(q).trim();
  let res = H.map((h,i)=>i);
  if(cat==='★ Favoritos') res = res.filter(i=>favs.has(H[i].n));
  else if(cat!=='Todos') res = res.filter(i=>H[i].c===cat);
  if(nq){
    if(/^\d+$/.test(nq)){
      const n = +nq;
      res = res.filter(i=>H[i].n===n || String(H[i].n).startsWith(nq));
      res.sort((a,b)=>(H[a].n===n?-1:0)-(H[b].n===n?-1:0));
    } else {
      const words = nq.split(/\s+/);
      res = res.filter(i=>words.every(w=>idx[i].includes(w)));
    }
  }
  $('#count').textContent = res.length + (res.length===1?' hino':' hinos');
  $('#list').innerHTML = res.length ? res.slice(0,300).map(i=>{
    const h=H[i];
    return `<button class="item" data-n="${h.n}"><span class="num">${String(h.n).padStart(3,'0')}</span>
      <span class="t"><b>${esc(h.t)}</b><small>${esc(h.s||h.c)}</small></span>${favs.has(h.n)?'<span class="st">★</span>':''}</button>`;
  }).join('') + (res.length>300?'<div class="empty">Refine a busca para ver mais…</div>':'')
  : `<div class="empty">${cat==='★ Favoritos'?'Nenhum favorito ainda. Abra um hino e toque em ☆.':'Nenhum hino encontrado.'}</div>`;
}

/* ---------- HINO ---------- */
let cur = null;
function renderHino(n){
  const h = H.find(x=>x.n===n); if(!h){location.hash='#/';return}
  cur = h;
  $('#back').classList.remove('hide'); $('#bar').classList.remove('hide');
  $('#title').textContent = String(h.n).padStart(3,'0')+' · '+h.t;
  const coro = h.k.length ? h.k[0] : null;
  const verses = h.v.map((v,i)=>{
    let s = `<div class="verse"><div class="vn">${esc(v[0])}</div><div class="vt">${esc(v[1])}</div></div>`;
    if(coro && (S.rep || i===0)) s += `<div class="verse coro"><div class="vn">♪</div><div class="vt">${esc(coro[1])}</div></div>`;
    return s;
  }).join('') || (coro?`<div class="verse coro"><div class="vn">♪</div><div class="vt">${esc(coro[1])}</div></div>`:'');
  $('#main').innerHTML = `<div class="wrap" style="--fs:${S.fs}px">
    <div class="meta"><div class="big">${esc(h.c)}${h.s&&h.s!==h.c?' · '+esc(h.s):''}</div>
      <h2>${esc(h.t)}</h2>
      ${h.e?`<p><i>${esc(h.e)}</i></p>`:''}
      ${h.a.length?`<p>${h.a.map(esc).join(' &nbsp;·&nbsp; ')}</p>`:''}
      ${h.b?`<p>📖 ${esc(h.b)}</p>`:''}</div>
    ${verses}
    <div class="nav"><button id="prev" ${h.n<=1?'disabled':''}>← Anterior</button><button id="next" ${h.n>=H.length?'disabled':''}>Próximo →</button></div></div>`;
  $('#main').scrollTop = 0;
  $('#prev').onclick = ()=>go(h.n-1); $('#next').onclick = ()=>go(h.n+1);
  updBar();
  LS.set('last', h.n);
}
function updBar(){
  if(!cur) return;
  const f = favs.has(cur.n);
  $('#fav').innerHTML = `<span>${f?'★':'☆'}</span>favorito`; $('#fav').classList.toggle('on', f);
  $('#rep').classList.toggle('on', S.rep);
  $('#wake').classList.toggle('on', !!wakeLock);
}
const go = n => { location.hash = '#/h/'+n };
async function toggleWake(){
  if(wakeLock){ releaseWake(); toast('Tela pode apagar'); updBar(); return }
  try{ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;updBar()}); toast('Tela permanecerá ligada'); }
  catch{ toast('Recurso não disponível neste aparelho') }
  updBar();
}
function releaseWake(){ if(wakeLock){ try{wakeLock.release()}catch{} wakeLock=null } }

/* ---------- ROTAS ---------- */
let listScroll = 0;
function route(){
  const m = location.hash.match(/^#\/h\/(\d+)/);
  if(m){ renderHino(+m[1]); }
  else { cur = null; $('#main').innerHTML=''; renderList(listScroll); }
}
window.addEventListener('hashchange', route);

/* ---------- EVENTOS ---------- */
$('#main').addEventListener('click', e=>{
  const it = e.target.closest('.item'); if(it){ listScroll=$('#main').scrollTop; go(+it.dataset.n) }
});
$('#back').onclick = ()=>{ if(history.length>1) history.back(); else location.hash='#/' };
$('#theme').onclick = ()=>{ S.theme = document.documentElement.dataset.theme==='dark'?'light':'dark'; saveS(); applyTheme() };
$('#fsm').onclick = ()=>{ S.fs=Math.max(14,S.fs-2); saveS(); renderHino(cur.n) };
$('#fsp').onclick = ()=>{ S.fs=Math.min(44,S.fs+2); saveS(); renderHino(cur.n) };
$('#rep').onclick = ()=>{ S.rep=!S.rep; saveS(); renderHino(cur.n); toast(S.rep?'Coro repetido após cada estrofe':'Coro exibido uma vez') };
$('#wake').onclick = toggleWake;
$('#fav').onclick = ()=>{ favs.has(cur.n)?favs.delete(cur.n):favs.add(cur.n); saveF(); updBar(); toast(favs.has(cur.n)?'Adicionado aos favoritos':'Removido dos favoritos') };

/* ---------- INSTALAÇÃO / OFFLINE ---------- */
let deferred = null;
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferred=e; $('#install').classList.remove('hide') });
$('#install').onclick = async ()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $('#install').classList.add('hide') };
addEventListener('appinstalled', ()=>{ $('#install').classList.add('hide'); toast('App instalado!') });
const netUpd = ()=> $('#net').classList.toggle('hide', navigator.onLine);
addEventListener('online',netUpd); addEventListener('offline',netUpd); netUpd();

if('serviceWorker' in navigator){
  addEventListener('load', async ()=>{
    try{
      const wasControlled = !!navigator.serviceWorker.controller;
      await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      if(!wasControlled && !LS.get('offlineToast',false)){ LS.set('offlineToast',true); toast('✓ Hinário salvo para uso offline'); }
    }catch(e){ console.warn('SW falhou', e) }
  });
}
if(navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ---------- INÍCIO ---------- */
applyTheme();
fetch('hinos.json').then(r=>r.json()).then(data=>{
  H = data;
  idx = H.map(h=>norm([h.t,h.e,h.a.join(' '),h.b,h.v.map(v=>v[1]).join(' '),h.k.map(k=>k[1]).join(' ')].join(' ')));
  cats = [...new Set(H.map(h=>h.c).filter(Boolean))];
  route();
}).catch(()=>{ $('#main').innerHTML='<div class="empty">Não foi possível carregar os hinos. Conecte-se à internet na primeira abertura.</div>' });
</script>
</body>
</html>
